<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniGen Free Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .animated-gradient {
      background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #0284c7);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased">

  <!-- HEADER -->
  <header class="h-16 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between px-6">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl animated-gradient flex items-center justify-center text-white shadow-md">
        <i data-lucide="wand-2" class="w-5 h-5"></i>
      </div>
      <h1 class="font-bold text-base text-white tracking-wide">
        OmniGen <span class="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">100% Free / No Key</span>
      </h1>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <!-- CONTROLS -->
    <aside class="w-full lg:w-96 border-r border-slate-800 bg-slate-900/30 p-6 space-y-6 shrink-0">
      
      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="cpu" class="w-3.5 h-3.5 text-brand-500"></i> Free Engine
        </label>
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-slate-300 flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
          <span>Flux.1 Public Inference Engine (Unlimited / No API Key required)</span>
        </div>
      </div>

      <!-- Prompt Input -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="message-square-plus" class="w-3.5 h-3.5 text-brand-500"></i> Prompt
        </label>
        <textarea id="promptInput" rows="4" placeholder="A mystical floating island covered in glowing cherry blossom trees, cinematic lighting, hyper-detailed..." class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:border-brand-500 outline-none resize-none"></textarea>
      </div>

      <!-- Action Button -->
      <button id="generateBtn" onclick="generateFreeImage()" class="w-full animated-gradient text-white font-bold py-3.5 px-4 rounded-xl shadow-xl flex items-center justify-center gap-2 text-sm hover:opacity-90">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span>Generate Artwork Free</span>
      </button>

    </aside>

    <!-- DISPLAY -->
    <section class="flex-1 flex flex-col bg-slate-950 p-6 overflow-y-auto">
      <div class="flex-1 glass-card rounded-2xl border border-slate-800 flex items-center justify-center p-4 relative overflow-hidden min-h-[380px]">
        
        <div id="loader" class="hidden flex-col items-center justify-center space-y-4">
          <div class="w-12 h-12 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
          <p class="text-sm font-medium text-slate-300">Rendering high-res art...</p>
        </div>

        <div id="emptyState" class="text-center p-6 space-y-2">
          <div class="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600 mx-auto mb-2">
            <i data-lucide="image" class="w-7 h-7"></i>
          </div>
          <h3 class="text-sm font-semibold text-slate-300">No Key Needed</h3>
          <p class="text-xs text-slate-500 max-w-xs">Type a prompt and hit Generate to render free images instantly.</p>
        </div>

        <div id="imageDisplay" class="hidden w-full h-full flex items-center justify-center">
          <img id="activeImage" src="" alt="Free Result" class="max-h-[500px] w-auto object-contain rounded-xl shadow-2xl">
        </div>

      </div>
    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

    async function generateFreeImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return alert('Please enter a prompt first!');

      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('imageDisplay').classList.add('hidden');
      document.getElementById('loader').classList.remove('hidden');

      const seed = Math.floor(Math.random() * 999999);
      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true`;

      const img = document.getElementById('activeImage');
      img.onload = () => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('imageDisplay').classList.remove('hidden');
      };
      img.onerror = () => {
        alert('Failed to render image.');
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
      };
      img.src = imgUrl;
    }
  </script>
</body>
</html>
